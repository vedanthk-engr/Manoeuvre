; PlatformIO Project Configuration File for Manoeuvre Wearable Glove
; Target: NodeMCU ESP8266 (ESP-12E / ESP-12F based)

[platformio]
default_envs = nodemcuv2
src_dir = src
include_dir = include

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
upload_speed = 460800

lib_deps =
    gilmaimon/ArduinoWebsockets@^0.5.4
    bblanchon/ArduinoJson@^6.21.3

build_flags =
    -D ESP8266
